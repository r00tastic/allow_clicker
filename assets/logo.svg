<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4de3ce"/>
      <stop offset="100%" stop-color="#7c9cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4de3ce" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#4de3ce" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4de3ce" stop-opacity="0"/>
    </radialGradient>
    <filter id="softshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="o"/>
      <feColorMatrix in="o" values="0 0 0 0 0.07  0 0 0 0 0.08  0 0 0 0 0.12  0 0 0 0.5 0"/>
      <feBlend in="SourceGraphic" in2="offsetblur"/>
    </filter>
  </defs>

  <!-- Arka ambient glow -->
  <circle cx="128" cy="128" r="120" fill="url(#glow)"/>

  <!-- Rounded square gradient background -->
  <rect x="20" y="20" width="216" height="216" rx="44" ry="44" fill="#0a0d14"/>
  <rect x="20" y="20" width="216" height="216" rx="44" ry="44" fill="url(#brand)" opacity="0.08"/>
  <rect x="20" y="20" width="216" height="216" rx="44" ry="44" fill="none" stroke="url(#brand)" stroke-width="2.5" opacity="0.6"/>

  <!-- Target reticle (ana ikon) -->
  <g transform="translate(128,128)" filter="url(#softshadow)">
    <!-- Dış halka -->
    <circle cx="0" cy="0" r="68" fill="none" stroke="url(#brand)" stroke-width="5"/>
    <!-- İç halka -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="url(#brand)" stroke-width="3.5"/>
    <!-- Çarpı -->
    <line x1="-86" y1="0" x2="-56" y2="0" stroke="url(#brand)" stroke-width="5" stroke-linecap="round"/>
    <line x1="56" y1="0" x2="86" y2="0" stroke="url(#brand)" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="-86" x2="0" y2="-56" stroke="url(#brand)" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="56" x2="0" y2="86" stroke="url(#brand)" stroke-width="5" stroke-linecap="round"/>
    <!-- Merkez nokta -->
    <circle cx="0" cy="0" r="8" fill="url(#brand)"/>

    <!-- Mouse cursor işareti (sağ alt) -->
    <g transform="translate(26,26) rotate(0)">
      <path d="M 0,0 L 0,34 L 10,24 L 16,36 L 22,33 L 16,21 L 30,21 Z"
            fill="#0a0d14" stroke="url(#brand)" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
